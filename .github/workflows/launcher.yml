# Збирає лаунчер під Windows, macOS і Linux (glibc та musl), робить інсталятори
# і на тег launcher-v* публікує підписаний реліз.
name: launcher

on:
  workflow_dispatch:
  push:
    tags: ["launcher-v*"]

permissions:
  contents: write

env:
  ALTHERRA_API: ${{ vars.ALTHERRA_API || 'https://launcher.altherra.com.ua:8443' }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Інсталятор
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/altherra-launcher.exe dist/Altherra-windows-x64.exe
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$version" "/DEXE=$PWD\dist\Altherra-windows-x64.exe" "/DOUT=$PWD\dist\Altherra-Setup-windows-x64.exe" installer\windows\altherra.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux-gnu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          cp target/release/altherra-launcher dist/altherra-launcher-linux-x64-gnu
          tar czf dist/Altherra-linux-x64.tar.gz -C target/release altherra-launcher
      - uses: actions/upload-artifact@v4
        with: { name: linux-gnu, path: dist/* }

  # musl (Alpine, Void, Gentoo musl…): збираємо в контейнері Alpine, динамічно з musl,
  # щоб лаунчер міг підвантажити системні Wayland/X11/OpenGL.
  linux-musl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Збірка в Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e ALTHERRA_API -e CARGO_TERM_COLOR alpine:3.22 sh -euc '
            apk add --no-cache build-base curl git fontconfig-dev libxkbcommon-dev wayland-dev mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
            . "$HOME/.cargo/env"
            export RUSTFLAGS="-C target-feature=-crt-static"
            cargo test --release --locked
            cargo build --release --locked
            mkdir -p dist
            cp target/release/altherra-launcher dist/altherra-launcher-linux-x64-musl
            # Перевірка, що збірка справді запускається на musl.
            ldd dist/altherra-launcher-linux-x64-musl | grep -q musl
            ALTHERRA_HOME=/tmp/al ALTHERRA_API=https://127.0.0.1:1 ./dist/altherra-launcher-linux-x64-musl --cli 2>&1 | grep -q "Помилка"
            chown -R '"$(id -u):$(id -g)"' dist target
          '
      - uses: actions/upload-artifact@v4
        with: { name: linux-musl, path: dist/* }

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Altherra.app (universal)
        run: |
          APP=dist/Altherra.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/altherra-launcher" \
            target/aarch64-apple-darwin/release/altherra-launcher \
            target/x86_64-apple-darwin/release/altherra-launcher
          ICONSET=$(mktemp -d)/AppIcon.iconset && mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Altherra</string>
            <key>CFBundleDisplayName</key><string>Altherra</string>
            <key>CFBundleIdentifier</key><string>ua.com.altherra.launcher</string>
            <key>CFBundleExecutable</key><string>altherra-launcher</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$APP"
          cd dist && ditto -c -k --keepParent Altherra.app Altherra-macos.zip && rm -rf Altherra.app
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: [windows, linux-gnu, linux-musl, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Інсталятор для Linux
        run: sh installer/linux/build.sh dist/altherra-launcher-linux-x64-gnu dist/altherra-launcher-linux-x64-musl assets/icon.png dist/Altherra-Setup-linux-x64.run
      - name: Контрольні суми й підпис
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::Немає секрету UPDATE_SIGNING_KEY — без підпису лаунчери не приймуть оновлення"; exit 1; }
          cd dist
          sha256sum * > SHA256SUMS.txt
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in SHA256SUMS.txt -out SHA256SUMS.txt.sig
          rm -f "$RUNNER_TEMP/key.pem"
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: Altherra Launcher ${{ github.ref_name }}
          files: dist/*
          body: |
            **Встановити:**
            - Windows 10/11 — `Altherra-Setup-windows-x64.exe`
            - Linux (glibc і musl) — `Altherra-Setup-linux-x64.run`, запуск: `sh Altherra-Setup-linux-x64.run`
            - macOS 11+ (Apple Silicon та Intel) — `Altherra-macos.zip`

            Без встановлення: `Altherra-windows-x64.exe`, `Altherra-linux-x64.tar.gz`.

            Уже встановлений лаунчер оновиться сам — кнопка «Оновити» зверху.
