[package]
name = "altherra-launcher"
version = "1.4.5"
edition = "2024"

[features]
# Офіційна збірка: вхід з ліцензією Microsoft. Без неї (--no-default-features) — Altherra Offline, лише вхід за ніком.
default = ["microsoft"]
microsoft = []

[dependencies]
anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.11.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = "1.19.0"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net"] }
uuid = { version = "1.29.3", features = ["v4"] }

[build-dependencies]
slint-build = "1.19.0"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
